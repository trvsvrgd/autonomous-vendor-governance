services:
  postgres:
    image: postgres:16-alpine
    container_name: vendor-governance-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: governance_admin
      POSTGRES_PASSWORD: governance_secret_pw
      POSTGRES_DB: vendor_governance
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U governance_admin -d vendor_governance"]
      interval: 5s
      timeout: 5s
      retries: 10

  localstack:
    image: localstack/localstack:3.8
    container_name: vendor-governance-localstack
    restart: unless-stopped
    ports:
      - "4566:4566"
    environment:
      SERVICES: s3,sqs,ses,secretsmanager,events
      AWS_DEFAULT_REGION: us-east-1
    volumes:
      - "./infra/localstack/init-aws.sh:/etc/localstack/init/ready.d/init-aws.sh"

volumes:
  pgdata:
